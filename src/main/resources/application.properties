spring.application.name=onfit

spring.config.import=optional:file:.env[.properties]

spring.front.domain=http://localhost:5173

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/onfit?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${SQL_PW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

aws.credentials.access-key=${AWS_ACCESS}
aws.credentials.secret-key=${AWS_SECRET}
aws.region.static=${AWS_REGION}
aws.s3.bucket=${S3_BUCKET}

spring.data.redis.host=localhost
spring.data.redis.port=6379
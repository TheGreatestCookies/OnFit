spring.application.name=onfit

spring.config.import=optional:file:.env[.properties]

spring.front.domain=http://localhost:5173

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.32.152:3307/onfit?useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${SQL_PW}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

aws.credentials.access-key=${AWS_ACCESS}
aws.credentials.secret-key=${AWS_SECRET}
aws.region.static=${AWS_REGION}
aws.s3.bucket=${S3_BUCKET}

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1
openai.model=gpt-5.1

# Logging Configuration
logging.level.root=INFO
logging.level.kspo.onfit=DEBUG
logging.level.kspo.onfit.chatbot.client=DEBUG
logging.level.reactor.netty.http.client=DEBUG

spring.data.redis.host=localhost
spring.data.redis.port=6379

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true
